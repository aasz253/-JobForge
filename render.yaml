databases:
  - name: jobforge-db
    plan: free
    databaseName: jobforge
    user: jobforge

services:
  - type: web
    name: jobforge-api
    runtime: python
    repo: https://github.com/aasz253/-JobForge.git
    rootDir: apps/api
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e ../../packages/shared ../../packages/scoring ../../packages/ai ../../packages/cv_utils ../../packages/email_intel ../../packages/github_api ../../packages/job_sources
    startCommand: 'bash -c ''URL="$DATABASE_URL"; URL="${URL#postgres://}"; URL="${URL#postgresql://}"; export DATABASE_URL="postgresql+psycopg://$URL"; exec python -m uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}"'''
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: prod
      - key: API_PREFIX
        value: /api
      - key: CORS_ORIGINS
        value: https://jobforge-uwj5.onrender.com
      - key: AI_PROVIDER
        value: openrouter

  - type: web
    name: jobforge
    runtime: node
    repo: https://github.com/aasz253/-JobForge.git
    rootDir: apps/web
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: 'bash -c ''cp -r .next/static .next/standalone/.next/static; [ -d public ] && cp -r public .next/standalone/public; exec node .next/standalone/server.js'''
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://jobforge-api-jw1r.onrender.com