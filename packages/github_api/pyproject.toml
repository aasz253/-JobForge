[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge-github"
version = "0.1.0"
description = "GitHub evidence engine for JobForge (Sifuna Codex)"
requires-python = ">=3.11"
dependencies = ["jobforge-shared>=0.1.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["jf_github"]