[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge-cv"
version = "0.1.0"
description = "CV parsing utilities for JobForge (Sifuna Codex)"
requires-python = ">=3.11"
dependencies = ["pypdf>=4.0", "python-docx>=1.1"]

[tool.setuptools]
packages = ["jf_cv"]