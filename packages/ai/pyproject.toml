[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge-ai"
version = "0.1.0"
description = "AI provider abstraction, analysis and safety for JobForge (Sifuna Codex)"
requires-python = ">=3.11"
dependencies = ["jobforge-shared>=0.1.0", "jobforge-scoring>=0.1.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["jf_ai"]